const def=()=>({version:1,xp:0,rewarded:{},done:{},activity:[],quizReward:{},quizChoice:{},drafts:{},writingClaimFloor:{},writingClaimDate:{},sources:[{id:'starter-tagawa',title:'宮司の経営',author:'田川伊吹',year:'2025',category:'神社経営',status:'これから読む',memo:'研究との接点：神社の経営判断や運営について、取り入れられる観点を検討する。※書誌事項は現物で確認する。'}],reflections:{},preferences:{title:'地方神社の運営の仕組みと経営判断に関する研究',dailyXp:60,targetChars:20000,deadline:''},view:'home',chapter:'intro',expanded:{axis:true},sessionTarget:15});
let state;try{state=merge(def(),JSON.parse(localStorage.getItem(KEY)||'null'))}catch{state=def()}
function merge(base,saved){if(!saved||typeof saved!=='object')return base;for(const k of ['xp','rewarded','done','activity','quizReward','quizChoice','drafts','writingClaimFloor','writingClaimDate','sources','reflections','preferences','view','chapter','expanded','sessionTarget','_dayXp'])if(saved[k]!==undefined)base[k]=saved[k];base.preferences={...def().preferences,...(saved.preferences||{})};if(!Array.isArray(base.sources))base.sources=[];if(!Array.isArray(base.activity))base.activity=[];if(!['home','map','write','sources','notes','settings'].includes(base.view))base.view='home';return base}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('保存できませんでした。書き出しでバックアップしてください')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function dateText(){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'long'}).format(new Date())}
function countChars(s){return [...String(s||'').replace(/\s/g,'')].length}
function completed(){return STAGES.reduce((n,s)=>n+s.tasks.filter((_,i)=>state.done[s.id+'-'+i]).length,0)}
function allTasks(){return STAGES.reduce((n,s)=>n+s.tasks.length,0)}
function nextTask(){for(const s of STAGES)for(let i=0;i<s.tasks.length;i++)if(!state.done[s.id+'-'+i])return {stage:s,index:i,task:s.tasks[i],id:s.id+'-'+i};return null}
function written(){return CHAPTERS.reduce((n,c)=>n+countChars(state.drafts[c.id]),0)}
function level(){return Math.floor(Math.max(0,state.xp)/200)+1}
function xpLevel(){return Math.max(0,state.xp)%200}
function streak(){const set=new Set(state.activity),d=new Date(today()+'T12:00:00+09:00');if(!set.has(today()))d.setDate(d.getDate()-1);let v=0;for(let i=0;i<3000;i++){let x=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);if(!set.has(x))break;v++;d.setDate(d.getDate()-1)}return v}
function earn(amount,msg){state.xp=Math.max(0,Number(state.xp)||0)+amount;if(!state.activity.includes(today()))state.activity.push(today());const key='_dayXp';state[key] ??={};state[key][today()]=(state[key][today()]||0)+amount;save();toast('✨ +'+amount+' XP！ '+msg)}
function dayXP(){return (state._dayXp||{})[today()]||0}
function levelBar(){return Math.round(xpLevel()/200*100)}

function weekDots(){const start=new Date(today()+'T12:00:00+09:00');start.setDate(start.getDate()-6);const days=['日','月','火','水','木','金','土'];return Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);let key=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);let done=state.activity.includes(key);return `<div class="day ${done?'done':''} ${key===today()?'today':''}"><div class="d">${days[d.getDay()]}</div><div class="daydot">${done?'✓':d.getDate()}</div></div>`}).join('')}
function statCards(){return `<div class="stat-grid"><div class="stat"><span class="em">🔥</span><strong>${streak()}日</strong><small>連続学習</small></div><div class="stat"><span class="em">⚡</span><strong>${state.xp} <small>XP</small></strong><small>累計経験値</small></div><div class="stat"><span class="em">✍️</span><strong>${written().toLocaleString('ja-JP')} <small>字</small></strong><small>書いた文字数</small></div></div>`}
function focusCard(){const t=nextTask();if(!t)return `<div class="focus"><div class="focus-bubble">🏆</div><div class="focus-body"><h3>すべてのクエストを達成！</h3><p>見直しや指導教員との確認を進めよう。</p></div></div>`;return `<div class="focus"><div class="focus-bubble">${t.stage.icon}</div><div class="focus-body"><div class="label">NEXT QUEST ・ ${esc(t.stage.name)}</div><h3>${esc(t.task[0])}</h3><p>${esc(t.task[1])}</p><div class="minirow"><span class="mini-chip">⏱ 約${t.task[2]}分</span><span class="mini-chip">⚡ +${t.task[2]>=25?35:25} XP</span></div></div><button class="quest-btn" data-task="${t.id}">完了 ✓</button></div>`}
function home(){const goal=Math.max(10,Number(state.preferences.dailyXp)||60),p=Math.min(100,Math.round(dayXP()/goal*100));const quiz=QUIZZES[dayOrdinal()%QUIZZES.length];const qDone=!!state.quizReward[today()];return `<div class="topbar"><div><div class="eyebrow">${esc(dateText())}</div><h1>おかえり。今日も一歩進もう！</h1></div><span class="chip">${deadlineBadge()}</span></div>${statCards()}<section class="hero"><div class="hero-copy"><span class="tag">🎓 君専用の卒論アドベンチャー</span><h2>小さな一歩が、<br>卒論の完成につながる。</h2><p>どんな研究テーマも、今日の一歩から進めよう。</p><button class="primary" data-nav="map">今日のクエストへ →</button></div><div class="hero-art" aria-hidden="true">🦊📖</div></section><div class="section-heading"><h2>🎯 次にやること</h2><span>${completed()}/${allTasks()}個クリア</span></div>${focusCard()}<div class="section-heading"><h2>今日のチャレンジ</h2><span>${dayXP()}/${goal} XP</span></div><div class="bar" style="height:14px;margin-bottom:16px"><span style="width:${p}%;background:#ffc768"></span></div><div class="two-cols"><div class="small-card"><div class="eyebrow">🧠 DAILY QUIZ</div><h3>${qDone?'今日の1問、クリア！':'研究の1問にチャレンジ'}</h3><p>${qDone?'明日も研究の考え方を確認しよう。':'研究設計や論文執筆の考え方を1問ずつ確かめる。'}</p><button class="ghost" data-quiz="1">${qDone?'解説を見直す':'1問解く →'}</button></div><div class="small-card"><div class="eyebrow">✍️ WRITING ROOM</div><h3>今日は150字だけ書く</h3><p>きれいな文章じゃなくて大丈夫。まずは自分の言葉を残そう。</p><button class="ghost" data-nav="write">執筆室を開く →</button></div></div><p class="foot-note">研究の問いや字数目標は設定から変更できます。実際の提出要項・指導方針を優先してください。</p>`}
function mapPage(){return `<div class="page-head"><div class="eyebrow">LEARNING PATH</div><h1>🗺️ 卒論完成へのマップ</h1><p>全${allTasks()}クエスト。完了したらチェックして経験値を獲得。学習順は目安なので、どの段階からでも進められるよ。</p></div><div style="margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="tag-soft">${completed()} / ${allTasks()} 完了</span><button class="ghost" data-nav="write">文章を書く →</button></div>${STAGES.map((s,idx)=>{const dn=s.tasks.filter((_,i)=>state.done[s.id+'-'+i]).length;const open=state.expanded[s.id]===true;return `<section class="stage"><div class="stage-header" data-expand="${s.id}" role="button" tabindex="0" aria-expanded="${open}"><div class="stage-medal" style="background:${s.color}">${s.icon}</div><div class="stage-title"><div class="eyebrow">STAGE ${idx+1} ${dn===s.tasks.length?'・CLEAR!':''}</div><h3>${esc(s.name)}</h3><p>${esc(s.sub)}</p><div class="stage-progress"><span style="width:${Math.round(dn/s.tasks.length*100)}%"></span></div></div><div class="stage-count">${dn}/${s.tasks.length} <span style="color:#98aca1">${open?'▴':'▾'}</span></div></div>${open?`<div class="stage-tasks">${s.tasks.map((t,i)=>{const id=s.id+'-'+i,done=!!state.done[id];return `<div class="task-row ${done?'complete':''}"><button class="task-done ${done?'checked':''}" data-task="${id}" aria-label="${esc(t[0])}を${done?'未完了にする':'完了にする'}">${done?'✓':''}</button><div class="task-text"><strong>${esc(t[0])}</strong><p>${esc(t[1])}</p></div><div class="task-meta">${t[2]}分<br>+${t[2]>=25?35:25} XP</div></div>`}).join('')}</div>`:''}</section>`}).join('')}`}
function writePage(){const c=CHAPTERS.find(x=>x.id===state.chapter)||CHAPTERS[0];const charCount=countChars(state.drafts[c.id]);const floor=state.writingClaimFloor[c.id]||0;const claimed=state.writingClaimDate[c.id]===today();const eligible=!claimed&&charCount>=floor+150;const target=Math.max(1,Number(state.preferences.targetChars)||20000);return `<div class="page-head"><div class="eyebrow">WRITING STUDIO</div><h1>✍️ 執筆室</h1><p>章ごとに下書きを自動保存。150字分の新しい文章を書いたら、その日の執筆XPを受け取れるよ。</p></div><div class="small-card" style="margin-bottom:19px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><strong style="font-size:14px">卒論の執筆メーター</strong><div style="font-size:12px;color:var(--muted);margin:5px 0 12px">${written().toLocaleString('ja-JP')} / ${target.toLocaleString('ja-JP')} 字（仮の目標）</div></div><span class="tag-soft">${Math.min(100,Math.round(written()/target*100))}%</span></div><div class="bar"><span style="width:${Math.min(100,Math.round(written()/target*100))}%"></span></div></div><div class="writer-layout"><div class="chapter-list">${CHAPTERS.map(ch=>`<button class="chapter-tab ${ch.id===c.id?'active':''}" data-chapter="${ch.id}">${esc(ch.title)}<small>${countChars(state.drafts[ch.id]).toLocaleString('ja-JP')}字</small></button>`).join('')}</div><div class="editor"><div class="editor-top"><h2>${esc(c.title)}</h2><span class="tag-soft" id="editor-save">● 自動保存</span></div><p>${esc(c.sub)}｜自分の言葉で、まずは書いてみよう。</p><div class="writing-prompts"><strong>💡 書き始めのヒント</strong><ul>${c.prompts.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div><textarea id="draft" data-draft="${c.id}" placeholder="ここから書き始めよう。小さなメモでもOK。" aria-label="${esc(c.title)}の下書き"></textarea><div class="writer-footer"><span id="draft-counter">${charCount.toLocaleString('ja-JP')} 字（空白・改行除く）</span><button class="primary" id="writing-reward" data-writing-claim="${c.id}" ${eligible?'':'disabled'}>${claimed?'✅ 今日の執筆を達成':'150字書いて +25 XP'}</button></div><p class="foot-note" id="claim-note">${claimed?'この章の執筆XPは明日また獲得できます。':`次の記録まであと${Math.max(0,floor+150-charCount)}字。各章1日1回まで。`}</p><div class="divider"></div><button class="ghost" data-download-draft="1">📥 全章をMarkdownで保存</button></div></div>`}
function sourcesPage(){return `<div class="page-head"><div class="eyebrow">RESEARCH LIBRARY</div><h1>📚 文献箱</h1><p>論文や本を記録して、読みっぱなしを防ごう。書誌情報は原典と照らして確認してね。</p></div><form class="inline-form" id="source-form"><h3>＋ 新しい文献を追加</h3><div class="form-grid"><div class="field"><label for="source-title">タイトル *</label><input id="source-title" name="title" maxlength="200" placeholder="例：〇〇の研究" required></div><div class="field"><label for="source-author">著者</label><input id="source-author" name="author" maxlength="150" placeholder="著者名"></div><div class="field"><label for="source-year">発行年</label><input id="source-year" name="year" maxlength="30" placeholder="2025"></div><div class="field"><label for="source-category">分類</label><select id="source-category" name="category">${['基礎文献','先行研究','理論・概念','研究方法','資料・データ','その他'].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div><div class="field"><label for="source-memo">内容・研究とのつながり</label><textarea id="source-memo" name="memo" placeholder="重要な主張や、卒論で使いたい視点"></textarea></div><button class="primary" type="submit">文献を追加 ＋</button></form><div class="section-heading"><h2>登録した文献</h2><span>${state.sources.length}件</span></div><input class="searchbar" id="source-search" placeholder="🔎 タイトル・著者・分類を検索" aria-label="文献を検索"/><div id="source-list" class="source-grid">${sourceCards('')}</div>`}
function sourceCards(search){const s=search.trim().toLowerCase();const list=state.sources.filter(x=>[x.title,x.author,x.year,x.category,x.memo].join(' ').toLowerCase().includes(s));return list.length?list.map(x=>`<article class="source-card"><div class="source-symbol">📖</div><div class="source-body"><strong>${esc(x.title)}</strong><p>${esc([x.author,x.year,x.category].filter(Boolean).join(' ／ '))}${x.memo?'<br>'+esc(x.memo):''}</p><div class="source-actions"><span class="pill">${esc(x.status||'これから読む')}</span><button class="pill" data-source-status="${esc(x.id)}">状態を進める →</button><button class="pill delete" data-source-delete="${esc(x.id)}">削除</button></div></div></article>`).join(''):`<div class="empty">見つかる文献がありません。検索条件を変えてみてね。</div>`}
function notesPage(){return `<div class="page-head"><div class="eyebrow">RESEARCH NOTEBOOK</div><h1>📝 研究ノート</h1><p>頭の中にある疑問や現場で気づいたことを、言葉にして残そう。記入内容は自動保存されます。</p></div>${REFLECTIONS.map((n,i)=>`<article class="note-card"><div class="eyebrow">NOTE ${i+1}</div><h3>${esc(n[0])}</h3><p>${esc(n[1])}</p><textarea data-reflection="${i}" placeholder="ここにメモする"></textarea></article>`).join('')}<p class="foot-note">調査記録に個人情報や機密性の高い内容が含まれる場合は、ブラウザではなく大学指定の安全な保存先を利用してください。</p>`}
function settingsPage(){return `<div class="page-head"><div class="eyebrow">YOUR JOURNEY</div><h1>⚙️ 設定・バックアップ</h1><p>研究の進み方は自分で調整できるよ。数字は初期値であり、大学の提出条件ではありません。</p></div><form class="setting-box" id="settings-form"><h2>研究と目標の設定</h2><div class="field"><label for="pref-title">研究テーマ（仮題）</label><textarea name="title" id="pref-title" maxlength="300">${esc(state.preferences.title)}</textarea></div><div class="form-grid"><div class="field"><label for="pref-xp">1日の目標XP</label><input type="number" name="dailyXp" id="pref-xp" min="10" max="500" value="${Number(state.preferences.dailyXp)||60}"></div><div class="field"><label for="pref-chars">執筆目標文字数（仮）</label><input type="number" name="targetChars" id="pref-chars" min="1000" max="200000" value="${Number(state.preferences.targetChars)||20000}"></div><div class="field"><label for="pref-deadline">提出予定日（未設定でもOK）</label><input type="date" name="deadline" id="pref-deadline" value="${esc(state.preferences.deadline||'')}"></div></div><button type="submit" class="primary">設定を保存</button></form><section class="setting-box"><h2>💾 データのバックアップ</h2><p style="font-size:13px;line-height:1.9;color:var(--muted)">このアプリはサーバーに送信しません。保存先はこのブラウザ内のみ。端末のデータ消去やプライベートブラウズでは失われる可能性があるので、ときどきJSONで書き出してね。</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="backup-export">⬇ JSONを書き出す</button><button class="ghost" id="backup-import">⬆ JSONを読み込む</button><input type="file" id="backup-file" accept="application/json,.json" hidden></div></section><section class="setting-box"><h2>🧹 最初からやり直す</h2><p style="font-size:12px;color:var(--muted)">クエスト、執筆、文献、研究ノートがすべて初期化されます。必要なら先にバックアップしてね。</p><button class="danger" id="reset-data">全データを初期化</button></section><p class="foot-note">アプリ名：卒論クエスト ／ 研究テーマは設定から編集できます ／ 完了判定とXPは自己記録です。</p>`}
function quizView(){const idx=dayOrdinal()%QUIZZES.length,q=QUIZZES[idx],answered=state.quizReward[today()],chosen=Number.isInteger(state.quizChoice[today()])?state.quizChoice[today()]:null;return `<div class="page-head"><div class="eyebrow">DAILY KNOWLEDGE CHECK</div><h1>🧠 今日の研究1問</h1><p>間違えても大丈夫。解説を確認して理解につなげよう。</p></div><div class="quiz-card"><div class="eyebrow">QUESTION ${idx+1} / ${QUIZZES.length}</div><h2 style="font-size:20px;line-height:1.65">${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''} ${answered?(i===q.answer?'correct':chosen===i?'wrong':''):''}" data-answer="${i}" ${answered?'disabled':''}>${'ABC'[i]}　${esc(o)}</button>`).join('')}${answered?`<div class="quiz-feedback"><strong>🎉 今日の一問を達成！</strong><br>正解は <strong>${'ABC'[q.answer]}</strong>。${esc(q.why)}</div>`:chosen===null?'':`<div class="quiz-feedback">${chosen===q.answer?'そのとおり！ 🎉':'惜しい！ もう一度考えてみよう。'}<br>${chosen===q.answer?esc(q.why):'ヒント：調査で確かめられるか、根拠を説明できるかを考えてみてね。'}</div>`}<div style="margin-top:18px"><button class="ghost" data-nav="home">← ホームに戻る</button></div></div>`}
function dayOrdinal(){const d=new Date(today()+'T00:00:00+09:00');return Math.floor(d.getTime()/86400000)}
function render(){const quiz=state.view==='quiz';document.getElementById('root').innerHTML=`<div class="app">${sidebar()}<main class="main">${quiz?quizView():state.view==='home'?home():state.view==='map'?mapPage():state.view==='write'?writePage():state.view==='sources'?sourcesPage():state.view==='notes'?notesPage():settingsPage()}</main>${rightbar()}</div>${bottomNav()}`;hydrate()}
function hydrate(){const draft=document.getElementById('draft');if(draft){draft.value=state.drafts[state.chapter]||'';draft.addEventListener('input',e=>{state.drafts[state.chapter]=e.target.value;save();document.getElementById('draft-counter').textContent=countChars(e.target.value).toLocaleString('ja-JP')+' 字（空白・改行除く）';let floor=state.writingClaimFloor[state.chapter]||0,chars=countChars(e.target.value),claimed=state.writingClaimDate[state.chapter]===today(),btn=document.getElementById('writing-reward');btn.disabled=claimed||chars<floor+150;document.getElementById('claim-note').textContent=claimed?'この章の執筆XPは明日また獲得できます。':`次の記録まであと${Math.max(0,floor+150-chars)}字。各章1日1回まで。`})}document.querySelectorAll('[data-reflection]').forEach(el=>{el.value=state.reflections[el.dataset.reflection]||'';el.addEventListener('input',()=>{state.reflections[el.dataset.reflection]=el.value;save()})});const f=document.getElementById('source-search');if(f)f.addEventListener('input',()=>{document.getElementById('source-list').innerHTML=sourceCards(f.value)})}
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
function route(view){state.view=view;save();render();window.scrollTo({top:0,behavior:'instant'})}
function handleTask(id){const [s,i]=id.split('-'),stage=STAGES.find(st=>st.id===s),n=Number(i);if(!stage||!stage.tasks[n])return;const already=!!state.done[id];state.done[id]=!already;if(!already&&!state.rewarded[id]){state.rewarded[id]=true;earn(stage.tasks[n][2]>=25?35:25,'クエストクリア！')}else{save();toast(already?'未完了に戻しました':'完了にしました（XP獲得済み）')}render()}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadDraft(){const text=`# ${state.preferences.title}\n\n`+CHAPTERS.map(c=>`## ${c.title}\n\n${state.drafts[c.id]||''}\n`).join('\n');download('卒論_下書き_'+today()+'.md',text,'text/markdown;charset=utf-8');toast('下書きを保存しました')}
function handleClick(e){const b=e.target.closest('button,[data-expand]');if(!b)return;if(b.dataset.nav){route(b.dataset.nav);return}if(b.dataset.task){handleTask(b.dataset.task);return}if(b.dataset.expand){let id=b.dataset.expand;state.expanded[id]=!state.expanded[id];save();render();return}if(b.dataset.chapter){state.chapter=b.dataset.chapter;save();render();return}if(b.dataset.quiz){route('quiz');return}if(b.dataset.answer!==undefined){const ix=Number(b.dataset.answer),q=QUIZZES[dayOrdinal()%QUIZZES.length];if(state.quizReward[today()])return;state.quizChoice[today()]=ix;if(ix===q.answer){state.quizReward[today()]=true;earn(15,'今日の研究クイズ正解！')}else{save();toast('もう一度挑戦！')}render();return}if(b.dataset.writingClaim){const id=b.dataset.writingClaim,chars=countChars(state.drafts[id]),floor=state.writingClaimFloor[id]||0;if(state.writingClaimDate[id]===today()||chars<floor+150)return;state.writingClaimFloor[id]=chars;state.writingClaimDate[id]=today();earn(25,'150字の執筆、おつかれさま！');render();return}if(b.dataset.downloadDraft){downloadDraft();return}if(b.dataset.sourceStatus){let item=state.sources.find(x=>x.id===b.dataset.sourceStatus);if(item){let statuses=['これから読む','読み途中','要点整理済み'];item.status=statuses[(statuses.indexOf(item.status)+1)%statuses.length];save();render();toast('読書状態を更新しました')}return}if(b.dataset.sourceDelete){if(confirm('この文献を削除しますか？')){state.sources=state.sources.filter(x=>x.id!==b.dataset.sourceDelete);save();render()}return}if(b.id==='backup-export'){download('卒論クエスト_バックアップ_'+today()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('バックアップを保存しました');return}if(b.id==='backup-import'){document.getElementById('backup-file').click();return}if(b.id==='reset-data'){if(confirm('執筆や文献を含む、すべてのデータを初期化します。続けますか？')){state=def();save();render();toast('初期化しました')}return}}
document.addEventListener('click',handleClick);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.expand){e.preventDefault();e.target.click()}});document.addEventListener('submit',e=>{if(e.target.id==='source-form'){e.preventDefault();const d=new FormData(e.target),title=String(d.get('title')||'').trim();if(!title){toast('タイトルを入力してね');return}state.sources.unshift({id:'src_'+Date.now()+'_'+Math.round(Math.random()*1e6),title,author:String(d.get('author')||'').trim(),year:String(d.get('year')||'').trim(),category:String(d.get('category')||'その他'),memo:String(d.get('memo')||'').trim(),status:'これから読む'});save();render();toast('文献を追加しました')}else if(e.target.id==='settings-form'){e.preventDefault();const d=new FormData(e.target);state.preferences.title=String(d.get('title')||'').trim()||def().preferences.title;state.preferences.dailyXp=Math.max(10,Math.min(500,Number(d.get('dailyXp'))||60));state.preferences.targetChars=Math.max(1000,Math.min(200000,Number(d.get('targetChars'))||20000));state.preferences.deadline=String(d.get('deadline')||'');save();render();toast('設定を保存しました')}});document.addEventListener('change',async e=>{if(e.target.id!=='backup-file')return;const f=e.target.files?.[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(incoming.version!==1||!incoming.preferences||!incoming.drafts||!incoming.done||!Array.isArray(incoming.sources))throw Error('invalid');if(!confirm('現在のデータを読み込んだバックアップで置き換えます。続けますか？'))return;state=merge(def(),incoming);save();render();toast('バックアップを読み込みました')}catch{toast('有効なバックアップファイルではありません')}});
// Preserve the daily XP log in imported/loaded saves, even for older versions.
if(!state._dayXp||typeof state._dayXp!=='object')state._dayXp={};
render();
})();
</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./service-worker.js").catch(()=>{});}</script>
</body>
</html>
